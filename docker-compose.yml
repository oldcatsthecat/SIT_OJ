version: "3.8"

services:
  # --- 基础中间件 ---

  # Nacos: 注册中心
  oj-nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: oj-nacos
    networks:
      - oj-net
    environment:
      - MODE=standalone
      - JVM_XMS=384m
      - JVM_XMX=384m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

  # MySQL: 数据库
  oj-mysql:
    image: mysql:8.0
    container_name: oj-mysql
    networks:
      - oj-net
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=13575877459hhh
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p13575877459hhh"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --innodb_buffer_pool_size=128M
      - --performance_schema=OFF
      - --max_connections=50
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --- 判题系统核心 ---

  oj-judge-server:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1
    container_name: oj-judge-server
    networks:
      - oj-net
    restart: always
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETPCAP
      - MKNOD
    tmpfs:
      - /tmp
    volumes:
      - ./data/test_case:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-gateway:8001/judge/judge_server_heartbeat/
      - TOKEN=SIT_OJ_JUDGE_TOKEN_2026
      - judger_debug=1
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # --- 微服务模块 ---

  oj-gateway:
    build: ./sit_oj_backend/gateway
    container_name: oj-gateway
    networks:
      - oj-net
    ports:
      - "8001:8001"
    depends_on:
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  oj-user:
    build: ./sit_oj_backend/user
    container_name: oj-user
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  oj-problem:
    build: ./sit_oj_backend/problem
    container_name: oj-problem
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    volumes:
      - ./data/test_case:/data/test_case
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - OJ_TESTCASE_ENABLE_REMOTE_SYNC=false
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  oj-submission:
    build: ./sit_oj_backend/submission
    container_name: oj-submission
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  oj-judge-logic:
    build: ./sit_oj_backend/judge
    container_name: oj-judge-logic
    networks:
      - oj-net
    depends_on:
      oj-nacos:
        condition: service_healthy
      oj-judge-server:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - OJ_JUDGE_SERVER_URL=http://oj-judge-server:8080
      - OJ_JUDGE_TOKEN=SIT_OJ_JUDGE_TOKEN_2026
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  # --- 前端服务 ---
  oj-frontend:
    image: nginx:alpine
    container_name: oj-frontend
    networks:
      - oj-net
    ports:
      - "80:80"
    volumes:
      - ./sit_oj_backend/frontend/dist:/usr/share/nginx/html:ro
      - ./sit_oj_backend/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oj-gateway
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  oj-net:
    driver: bridge