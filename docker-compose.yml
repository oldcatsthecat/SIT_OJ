version: "3.8"

services:
  # Nacos: 注册中心
  oj-nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: oj-nacos
    networks:
      - oj-net
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5' # 注册中心不需要太多性能，但不能断供

  # MySQL: 数据库
  oj-mysql:
    image: mysql:8.0
    container_name: oj-mysql
    networks:
      - oj-net
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=13575877459hhh
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p13575877459hhh"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --innodb_buffer_pool_size=256M
      - --performance_schema=OFF
      - --max_connections=200
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0' # 保证数据库读写有足够的响应能力

  # Redis: 排行榜缓存 + 判题去重
  oj-redis:
    image: redis:7-alpine
    container_name: oj-redis
    networks:
      - oj-net
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'

  # RabbitMQ: 判题消息队列
  oj-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: oj-rabbitmq
    networks:
      - oj-net
    environment:
      - RABBITMQ_DEFAULT_USER=oj_admin
      - RABBITMQ_DEFAULT_PASS=oj_rabbit_2026
    ports:
      - "15672:15672"  # Web管理台
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # 判题服务器 (核心限制点：防止 CPU 100% 导致系统假死)
  oj-judge-server:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1
    container_name: oj-judge-server
    networks:
      - oj-net
    restart: always
    privileged: true
    user: root
    volumes:
      - ./data/test_case:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-gateway:8001/admin/judge/judge_server_heartbeat
      - TOKEN=SIT_OJ_JUDGE_TOKEN_2026
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0' # 核心设置：4核服务器最多给判题机2核，留出2核给业务和系统

  # --- 微服务模块 ---

  oj-gateway:
    build: ./sit_oj_backend/gateway
    container_name: oj-gateway
    networks:
      - oj-net
    ports:
      - "8001:8001"
    depends_on:
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxDirectMemorySize=64m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
    restart: always
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: '0.5' # 保证网关不会因为判题太猛而 504

  oj-user:
    build: ./sit_oj_backend/user
    container_name: oj-user
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms256m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
      - JWT_EXPIRATION=86400000
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  oj-problem:
    build: ./sit_oj_backend/problem
    container_name: oj-problem
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    volumes:
      - ./data/test_case:/data/test_case
    environment:
      - JAVA_OPTS=-Xms256m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
      - OJ_TESTCASE_ENABLE_REMOTE_SYNC=false
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  oj-submission:
    build: ./sit_oj_backend/submission
    container_name: oj-submission
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
      oj-rabbitmq:
        condition: service_healthy
      oj-redis:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms192m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
      - SPRING_RABBITMQ_HOST=oj-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=oj_admin
      - SPRING_RABBITMQ_PASSWORD=oj_rabbit_2026
      - SPRING_DATA_REDIS_HOST=oj-redis
      - SPRING_DATA_REDIS_PORT=6379
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  oj-competition:
    build: ./sit_oj_backend/competition
    container_name: oj-competition
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
      oj-redis:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms192m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
      - SPRING_DATA_REDIS_HOST=oj-redis
      - SPRING_DATA_REDIS_PORT=6379
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  oj-judge-logic:
    build: ./sit_oj_backend/judge
    container_name: oj-judge-logic
    networks:
      - oj-net
    depends_on:
      oj-nacos:
        condition: service_healthy
      oj-judge-server:
        condition: service_started
      oj-rabbitmq:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - OJ_JUDGE_SERVER_URL=http://oj-judge-server:8080
      - OJ_JUDGE_TOKEN=SIT_OJ_JUDGE_TOKEN_2026
      - JWT_SECRET=SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
      - JWT_EXPIRATION=86400000
      - SPRING_RABBITMQ_HOST=oj-rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=oj_admin
      - SPRING_RABBITMQ_PASSWORD=oj_rabbit_2026
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # 前端服务
  oj-frontend:
    image: nginx:alpine
    container_name: oj-frontend
    networks:
      - oj-net
    ports:
      - "80:80"
    volumes:
      - ./sit_oj_backend/frontend/dist:/usr/share/nginx/html:ro
      - ./sit_oj_backend/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oj-gateway
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

networks:
  oj-net:
    driver: bridge