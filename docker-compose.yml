version: "3.8"

services:
  # Nacos: 注册中心 (内存限制与 JVM 调优)
  oj-nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: oj-nacos
    networks:
      - oj-net
    environment:
      - MODE=standalone
      - JVM_XMS=128m
      - JVM_XMX=256m
      - JVM_XMN=64m
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848" # Nacos 2.x 必须
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # MySQL: 数据库 (压减 Buffer Pool 和 禁用性能统计)
  oj-mysql:
    image: mysql:8.0
    container_name: oj-mysql
    networks:
      - oj-net
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=13575877459hhh
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p13575877459hhh"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --innodb_buffer_pool_size=32M
      - --performance_schema=OFF
      - --max_connections=15
    deploy:
      resources:
        limits:
          memory: 192M

  # 判题服务器 (Go/C++ 底层服务)
  oj-judge-server:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1
    container_name: oj-judge-server
    networks:
      - oj-net
    restart: always
    privileged: true
    user: root
    volumes:
      - ./data/test_case:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judge-server:8080
      - BACKEND_URL=http://oj-gateway:8001/api/admin/judge/judge_server_heartbeat
      - TOKEN=SIT_OJ_JUDGE_TOKEN_2026
    deploy:
      resources:
        limits:
          memory: 256M

  # --- 微服务模块 (统一优化 JVM 参数) ---

  oj-gateway:
    build: ./sit_oj_backend/gateway
    container_name: oj-gateway
    networks:
      - oj-net
    ports:
      - "8001:8001"
    depends_on:
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:MaxDirectMemorySize=16m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  oj-user:
    build: ./sit_oj_backend/user
    container_name: oj-user
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  oj-problem:
    build: ./sit_oj_backend/problem
    container_name: oj-problem
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    volumes:
      - ./data/test_case:/data/test_case
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  oj-submission:
    build: ./sit_oj_backend/submission
    container_name: oj-submission
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  # 新增：比赛微服务
  oj-competition:
    build: ./sit_oj_backend/competition
    container_name: oj-competition
    networks:
      - oj-net
    depends_on:
      oj-mysql:
        condition: service_healthy
      oj-nacos:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://oj-mysql:3306/sit_oj?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  oj-judge-logic:
    build: ./sit_oj_backend/judge
    container_name: oj-judge-logic
    networks:
      - oj-net
    depends_on:
      oj-nacos:
        condition: service_healthy
      oj-judge-server:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xms64m -Xmx128m -XX:+UseSerialGC -Xss256k
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=oj-nacos:8848
      - OJ_JUDGE_SERVER_URL=http://oj-judge-server:8080
      - OJ_JUDGE_TOKEN=SIT_OJ_JUDGE_TOKEN_2026
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M

  # 前端服务
  oj-frontend:
    image: nginx:alpine
    container_name: oj-frontend
    networks:
      - oj-net
    ports:
      - "80:80"
    volumes:
      - ./sit_oj_backend/frontend/dist:/usr/share/nginx/html:ro
      - ./sit_oj_backend/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oj-gateway
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  oj-net:
    driver: bridge