# These zones run at the only public entry point. User-supplied IP headers are not trusted.
limit_req_zone $binary_remote_addr zone=oj_mail:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=oj_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oj_api:10m rate=10r/s;
limit_req_status 429;
map $request_uri $oj_request_path {
    ~^(?<oj_path_without_query>[^?]*) $oj_path_without_query;
    default /;
}
log_format oj_audit escape=json '{"timestamp":"$time_iso8601","service":"nginx",'
    '"requestId":"$request_id","clientIp":"$remote_addr","method":"$request_method",'
    '"path":"$oj_request_path","httpStatus":$status,"bytes":$body_bytes_sent,'
    '"userAgent":"$http_user_agent","upstreamStatus":"$upstream_status","durationSeconds":$request_time}';

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;
    # Separate paths avoid the official image's access.log -> /dev/stdout symlink.
    access_log /var/log/oj/access.ndjson oj_audit;
    error_log /var/log/oj/error.log warn;
    limit_req_log_level notice;
    add_header X-Request-ID $request_id always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /api/users/sendCode {
        limit_req zone=oj_mail burst=2 nodelay;
        include /etc/nginx/oj-proxy.conf;
        proxy_pass http://oj-gateway:8001/users/sendCode;
    }
    location ~ ^/api/users/(login|register|resetPassword|update)$ {
        limit_req zone=oj_auth burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/oj-proxy.conf;
        proxy_pass http://oj-gateway:8001;
    }
    location /api/ {
        limit_req zone=oj_api burst=30 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/oj-proxy.conf;
        proxy_pass http://oj-gateway:8001;
    }
}
