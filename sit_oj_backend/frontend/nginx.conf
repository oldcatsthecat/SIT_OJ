server {
    listen       80;
    server_name  localhost;
    client_max_body_size 50M;

    # 1. 静态资源与前端路由（最高优先级：检查物理文件）
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 核心逻辑：
        # 先找有没有真实文件，如果没有，统一交给 index.html (Vue 路由)
        # 这样刷新 /problems 时，由于没有对应物理文件，会成功加载 HTML
        try_files $uri $uri/ /index.html;
    }

    # 2. 接口转发 (正则表达式匹配)
    # 这里的关键在于：我们只拦截那些看起来像“接口路径”的请求
    # 接口通常是：/api/... 或 /problems/list (带子路径)
    location ~* ^/(api|problems/|submissions/|competitions/|judge/) {
        proxy_pass http://oj-gateway:8001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 针对上传大文件（如测试数据）的优化
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
}