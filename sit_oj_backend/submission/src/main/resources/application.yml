server:
  port: 8082

spring:
  application:
    name: submission
  datasource:
    url: jdbc:mysql://localhost:3306/sit_oj?useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:oj_app}
    password: ${DB_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:oj_admin}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 2
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

# Feign + Resilience4j 配置
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 60000

# Resilience4j 熔断器配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50        # 50% 失败率触发熔断
        wait-duration-in-open-state: 15s  # 熔断 15 秒后半开
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      competitionClient:
        base-config: default
      problemClient:
        base-config: default
      judgeClient:
        base-config: default
        wait-duration-in-open-state: 30s  # judge 出问题多等一会
  timelimiter:
    configs:
      default:
        timeout-duration: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
