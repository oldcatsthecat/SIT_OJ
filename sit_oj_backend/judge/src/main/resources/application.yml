server:
  port: 8083

spring:
  application:
    name: judge
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:oj_admin}
    password: ${SPRING_RABBITMQ_PASSWORD:oj_rabbit_2026}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1        # 一次只取一条，防止内存溢出
        concurrency: 1     # 最少消费者数
        max-concurrency: 2 # 最大消费者数（限制并发判题数）

oj:
  judge:
    server-url: http://123.60.72.80:8080
    token: CHANGE_THIS

# Resilience4j 熔断（保护外部判题机调用）
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      judgeServer:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 60s

jwt:
  secret: SIT_ALGORITHM_COMMUNITY_SECRET_KEY_2026_SECURE_VERSION
  expiration: 86400000