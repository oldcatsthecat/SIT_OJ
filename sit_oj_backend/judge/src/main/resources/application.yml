server:
  port: 8083

spring:
  application:
    name: judge
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:oj_admin}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1        # 一次只取一条，防止内存溢出
        concurrency: 2     # 固定两个判题消费者
        max-concurrency: 2 # 多余请求留在 RabbitMQ 队列中

oj:
  judge:
    server-url: ${OJ_JUDGE_SERVER_URL:http://localhost:8080}
    token: ${OJ_JUDGE_TOKEN}

# Resilience4j 熔断（保护外部判题机调用）
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      judgeServer:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 60s

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
