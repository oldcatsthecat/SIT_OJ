server:
  port: 8081

spring:
  application:
    name: problem
  datasource:
    url: jdbc:mysql://localhost:3306/sit_oj?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: ${DB_USERNAME:oj_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB       # 单个文件最大限制
      max-request-size: 50MB    # 单次请求总数据大小限制

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 # 你的 Nacos 地址

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名转换

oj:
  testcase:
    # 远程服务器配置
    remote-host: ${OJ_TESTCASE_REMOTE_HOST:}
    remote-path: ${OJ_TESTCASE_REMOTE_PATH:}
    remote-user: ${OJ_TESTCASE_REMOTE_USER:}
    remote-password: ${OJ_TESTCASE_REMOTE_PASSWORD:}
    # 本地存储配置
    local-base-path: ${OJ_TESTCASE_LOCAL_BASE_PATH:/data/test_case}
    enable-remote-sync: false  # 开发环境下设为 true，部署到服务器设为 false

jwt:
  # 必须至少 32 个字符，确保 HS256 算法安全
  secret: ${JWT_SECRET}
  # 过期时间，单位：毫秒 (86400000 = 24小时)
  expiration: 86400000